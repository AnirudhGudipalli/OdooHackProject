<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — StockSense IMS</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>My Profile</h1>
        <p>View and update your account details</p>
      </div>
    </div>
    <div class="page-content">
      <div style="max-width:560px">
        <div class="card" style="margin-bottom:20px" id="profile-card">
          <div style="text-align:center;padding:60px"><div class="spinner" style="width:36px;height:36px;border-width:3px"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Update Profile</span></div>
          <div class="card-body">
            <div id="update-alert" class="alert alert-danger alert-hidden"></div>
            <div id="update-success" class="alert alert-success alert-hidden"></div>
            <form id="update-form">
              <div class="form-group">
                <label class="form-label">Full Name <span>*</span></label>
                <input class="form-control" id="u-name" required />
              </div>
              <div class="form-group">
                <label class="form-label">Email Address <span>*</span></label>
                <input class="form-control" id="u-email" type="email" required />
              </div>
              <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
              <p class="text-sm text-muted" style="margin-bottom:12px">Leave password fields blank to keep current password</p>
              <div class="form-group">
                <label class="form-label">New Password</label>
                <input class="form-control" id="u-password" type="password" placeholder="New password (optional)" minlength="8" />
              </div>
              <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input class="form-control" id="u-confirm" type="password" placeholder="Confirm new password" />
              </div>
              <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/nav.js"></script>
<script>
  if (!requireAuth()) {}
  NAV.render('sidebar');

  async function load() {
    try {
      const p = await API.get('/dashboard/profile');
      const initials = (p.name || 'U').split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      document.getElementById('profile-card').innerHTML = `
        <div class="card-body" style="display:flex;align-items:center;gap:20px">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:white;font-size:24px;font-weight:700;flex-shrink:0">${escHtml(initials)}</div>
          <div>
            <div style="font-size:20px;font-weight:700">${escHtml(p.name)}</div>
            <div style="color:var(--text-muted)">${escHtml(p.email)}</div>
            <div style="margin-top:8px;display:flex;gap:8px">
              <span class="badge badge-${p.role.toLowerCase()}">${p.role}</span>
              ${p.warehouse_name ? `<span class="badge badge-info" style="background:#f0f9ff;color:#0369a1">🏭 ${escHtml(p.warehouse_name)}</span>` : ''}
            </div>
            <div class="text-muted text-sm" style="margin-top:8px">Member since ${formatDate(p.created_at)}</div>
          </div>
        </div>
      `;
      document.getElementById('u-name').value = p.name;
      document.getElementById('u-email').value = p.email;
    } catch (err) { toast(err.message, 'error'); }
  }

  document.getElementById('update-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('u-name').value.trim();
    const email = document.getElementById('u-email').value.trim();
    const password = document.getElementById('u-password').value;
    const confirm = document.getElementById('u-confirm').value;

    if (password && password !== confirm) {
      showAlert('update-alert', 'Passwords do not match');
      return;
    }

    const body = { name, email };
    if (password) body.password = password;

    const btn = e.submitter;
    btn.disabled = true;
    try {
      const updated = await API.put('/dashboard/profile', body);
      // Update stored user
      const user = API.getUser();
      API.saveSession(API.getToken(), { ...user, name: updated.name, email: updated.email });
      hideAlert('update-alert');
      document.getElementById('update-success').textContent = '✅ Profile updated successfully!';
      document.getElementById('update-success').classList.remove('alert-hidden');
      document.getElementById('u-password').value = '';
      document.getElementById('u-confirm').value = '';
      await load();
      setTimeout(() => document.getElementById('update-success').classList.add('alert-hidden'), 3000);
    } catch (err) { showAlert('update-alert', err.message); }
    btn.disabled = false;
  });

  load();
</script>
</body>
</html>
