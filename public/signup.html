<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — StockSense IMS</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">📦</div>
      <div class="auth-logo-text">
        <h1>StockSense</h1>
        <p>Inventory Management System</p>
      </div>
    </div>
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Join StockSense and start managing your inventory</p>

    <div id="signup-alert" class="alert alert-danger alert-hidden"></div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name <span>*</span></label>
        <input class="form-control" id="name" type="text" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address <span>*</span></label>
        <input class="form-control" id="email" type="email" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password <span>*</span></label>
        <input class="form-control" id="password" type="password" placeholder="Min 8 characters" required minlength="8" />
      </div>
      <div class="form-group">
        <label class="form-label" for="role">Role <span>*</span></label>
        <select class="form-control form-select" id="role" required>
          <option value="">Select a role…</option>
          <option value="MANAGER">Inventory Manager</option>
          <option value="STAFF">Warehouse Staff</option>
        </select>
      </div>
      <div class="form-group" id="warehouse-group" style="display:none">
        <label class="form-label" for="warehouse_id">Assigned Warehouse <span>*</span></label>
        <select class="form-control form-select" id="warehouse_id">
          <option value="">Loading warehouses…</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="signup-btn">Create Account</button>
    </form>
    <div class="auth-link">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (API.isLoggedIn()) window.location.href = '/dashboard.html';

    // Show warehouse selector for STAFF
    document.getElementById('role').addEventListener('change', async function() {
      const grp = document.getElementById('warehouse-group');
      const sel = document.getElementById('warehouse_id');
      if (this.value === 'STAFF') {
        grp.style.display = 'block';
        sel.required = true;
        // Load warehouses (no auth needed on signup page via public endpoint — we call directly)
        try {
          const res = await fetch('/api/warehouses', { headers: { 'Authorization': 'Bearer dummy' } });
          // This will fail (401) if no token — handle gracefully
        } catch {}
        // Fetch warehouses without auth for signup
        try {
          const res = await fetch('/api/warehouses-public');
          const whs = await res.json();
          sel.innerHTML = '<option value="">Select warehouse…</option>' +
            whs.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
        } catch {
          // Fallback: fetch with a temp approach
          sel.innerHTML = '<option value="">— ask admin for warehouse ID —</option>';
        }
      } else {
        grp.style.display = 'none';
        sel.required = false;
      }
    });

    // Load warehouses from a public endpoint (we add this route)
    async function loadWarehouses() {
      try {
        const res = await fetch('/api/warehouses/public');
        if (res.ok) {
          const whs = await res.json();
          const sel = document.getElementById('warehouse_id');
          sel.innerHTML = '<option value="">Select warehouse…</option>' +
            whs.map(w => `<option value="${w.id}">${w.name} — ${w.location}</option>`).join('');
        }
      } catch (e) {}
    }
    loadWarehouses();

    document.getElementById('signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      btn.disabled = true; btn.textContent = 'Creating account…';

      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
      };
      if (body.role === 'STAFF') {
        body.warehouse_id = parseInt(document.getElementById('warehouse_id').value);
      }

      const alertEl = document.getElementById('signup-alert');
      try {
        const data = await API.post('/auth/signup', body);
        API.saveSession(data.token, data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.remove('alert-hidden');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
